name: Build APK Mini Marker
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Siapkan Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instal Dependensi Sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
          pip install --upgrade pip setuptools wheel Cython==0.29.36 buildozer virtualenv
      - name: Build APK
        run: yes | buildozer -v android debug
      - name: Unggah Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniMarkerStudio-APK
          path: bin/*.apk
